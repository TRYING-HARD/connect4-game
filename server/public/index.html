<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1024"><meta name="description" content="Connect 4 — Four in a Row multiplayer game">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg">
<title>Connect 4 — Four in a Row</title><link rel="stylesheet" href="style.css">
</head>
<body>
<div class="glow glow-a"></div><div class="glow glow-b"></div>
<main>
<header class="brand"><div class="logo"><span class="slot red"></span><span class="slot yellow"></span><span class="slot red"></span><span class="slot yellow"></span></div><div><h1>CONNECT <em>4</em></h1><p>FOUR IN A ROW</p></div></header>
<section id="home" class="panel home-panel">
  <div class="eyebrow">PLAY TOGETHER</div><h2>Drop four. <span>Win.</span></h2><p class="sub">Challenge a friend online or play together on one device.</p>
  <label class="label" for="name">Your name</label><input id="name" maxlength="20" autocomplete="nickname" placeholder="e.g. Alex">
  <label class="label avatar-label" for="avatar">Choose your avatar</label>
  <div id="avatarPicker" class="avatar-picker" role="radiogroup" aria-label="Choose avatar"></div>
  <div class="primary-actions"><button id="create" class="primary"><span>＋</span> Create online game</button><button id="local" class="secondary">Two players here</button></div>
  <div class="divider"><span>OR JOIN A GAME</span></div>
  <div class="join"><input id="code" maxlength="5" autocapitalize="characters" placeholder="ENTER CODE"><button id="join">Join</button></div>
  <p id="msg" class="message" aria-live="polite"></p>
  <div class="home-settings"><label><input type="checkbox" id="sound" checked> Sound effects</label></div>
</section>
<section id="game" class="hidden">
  <div class="game-head"><div><div class="eyebrow" id="modeLabel">ONLINE GAME</div><h2 id="gameCode">GAME -----</h2></div><div class="head-actions"><button id="soundBtn" class="icon-btn" title="Toggle sound">🔊</button><button id="copy" class="icon-btn" title="Share game code">⧉ <span>Share</span></button></div></div>
  <div class="players">
    <div class="player-card p1card"><div id="avatar1" class="avatar red-avatar">🔴</div><div><b id="player1">Player 1</b><small id="p1state">Red</small><strong id="score1">0 wins</strong></div></div>
    <div class="vs">VS</div>
    <div class="player-card p2card"><div id="avatar2" class="avatar yellow-avatar">🟡</div><div><b id="player2">Player 2</b><small id="p2state">Yellow</small><strong id="score2">0 wins</strong></div></div>
  </div>
  <div class="status-pill"><span id="turnDot" class="turn-dot"></span><b id="turnText"></b></div>
  <div id="board" class="board" aria-label="Connect 4 board"></div>
  <div id="resultActions" class="result-actions hidden"><div id="resultText"></div><button id="rematch" class="primary">↻ Rematch</button></div>
  <div class="game-actions"><button id="restart" class="primary">↻ New round</button><button id="back" class="secondary">Leave game</button></div>
  <p class="tip">Tap a column to drop your counter.</p>
</section>
<footer>Connect 4 • Four in a Row</footer>
</main>
<div id="toast" class="toast" role="status"></div>
<script src="/socket.io/socket.io.js"></script><script src="app.js"></script>
</body></html>
